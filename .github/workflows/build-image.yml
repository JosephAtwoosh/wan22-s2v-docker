name: Build Wan2.2-S2V image

# Builds the CUDA 12.8 image on a GitHub-hosted runner (Docker, full network)
# and pushes it to GHCR, where Vast.ai can pull it.
#
# No local Docker needed. Run it from the repo's Actions tab ("Run workflow");
# the default GITHUB_TOKEN grants package write on a public repo, so no secrets
# are required. The base image is ~8 GB and the pip layers dominate the build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        required: true
        default: "latest"
      wan_ref:
        description: "Wan-Video/Wan2.2 commit to build against"
        required: true
        default: "1ea34ff48f87168174e12956e200b1d908b1c5ff"
  # A tag push is the trigger that works with a contents-only token:
  # workflow_dispatch needs Actions write, which a fine-grained PAT usually
  # does not have. Push `build-*` to build (tools/publish.js --tag does this).
  push:
    tags:
      - "build-*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Docker image names must be lowercase; Actions expressions have no
      # lowercase function, so the owner is lowered in bash.
      - name: Resolve lowercase image name
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wan22-s2v-docker" >> "$GITHUB_OUTPUT"

      # The runner's root filesystem is ~72 GB with ~22 GB free; the CUDA base,
      # torch wheels and the flash-attn wheel need far more.
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/lib/jvm \
                      /usr/local/.ghcup \
                      /usr/local/lib/android \
                      /usr/local/share/powershell \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            WAN_REF=${{ github.event.inputs.wan_ref || '1ea34ff48f87168174e12956e200b1d908b1c5ff' }}
          tags: |
            ${{ steps.img.outputs.image }}:${{ github.event.inputs.tag || 'latest' }}
            ${{ steps.img.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the Python stack imports in the real image: torch, the pinned
      # Wan checkout, and flash-attn (which S2V calls unconditionally).
      - name: Smoke test imports
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          docker run --rm -i "${IMAGE}:${TAG}" python - <<'PY'
          import torch, flash_attn, wan
          from wan.configs import WAN_CONFIGS
          cfg = WAN_CONFIGS["s2v-14B"]
          print("torch", torch.__version__, "| cuda build", torch.version.cuda)
          print("flash_attn", flash_attn.__version__)
          print("wan s2v", cfg.transformer.num_layers, "layers,", cfg.sample_steps, "steps,", cfg.sample_fps, "fps")
          print("ok")
          PY

      # The image ships the tests; running them here checks the real
      # dependency set, not the CI's.
      - name: Smoke test suite
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          docker run --rm "${IMAGE}:${TAG}" pytest -q /opt/wan-docker/tests
          docker run --rm "${IMAGE}:${TAG}" wan22-s2v version

      - name: Summary
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${IMAGE}:${{ github.event.inputs.tag || 'latest' }}"
            echo '```'
            echo
            echo "On Vast: make the GHCR package public (Package settings ->"
            echo "Change visibility -> Public), mount /models, then"
            echo "\`wan22-s2v download\` and \`wan22-s2v doctor\`."
          } >> "$GITHUB_STEP_SUMMARY"
